name: VVOS Glasses CI

on:
  push:
    branches: ['feature/vvos-glasses-p1-intelligence']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  glasses-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VVOS_ENV: staging
      NEXT_PUBLIC_SITE_URL: https://staging.voltvroom.nl
      VVOS_DATA_MODE: firebase
      VVOS_REQUIRE_AUTH: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repository and brand gates
        run: npm run repo:guard && npm run agent:audit && npm run brand:audit
      - name: Typecheck
        run: npm run typecheck
      - name: Glasses tests
        run: npm test -- tests/glasses.test.ts tests/glasses-api.test.ts tests/glasses-intelligence.test.ts
      - name: Production build
        run: npm run build
