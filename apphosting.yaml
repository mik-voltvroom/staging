# VVOS staging backend. This repository must never target production.
runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 40
  cpu: 1
  memoryMiB: 512

env:
  - variable: VVOS_ENV
    value: staging
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://staging.voltvroom.nl
    availability: [BUILD, RUNTIME]
  - variable: VVOS_REQUIRE_AUTH
    value: "true"
    availability:
      - BUILD
      - RUNTIME

  - variable: VVOS_DATA_MODE
    value: firebase
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability: [BUILD, RUNTIME]

  # Same secret names, separate values in each Firebase project.
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability: [RUNTIME]
  - variable: VWE_WEBHOOK_SECRET
    secret: VWE_WEBHOOK_SECRET
    availability: [RUNTIME]
  - variable: PORTAL_TOKEN_SECRET
    secret: PORTAL_TOKEN_SECRET
    availability: [RUNTIME]
  - variable: AUDIT_HASH_SALT
    secret: AUDIT_HASH_SALT
    availability: [RUNTIME]
