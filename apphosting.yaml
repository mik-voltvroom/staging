# VVOS staging backend. This repository must never target production.
runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 40
  cpu: 1
  memoryMiB: 512

env:
  - variable: VVOS_ENV
    value: staging
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://staging.voltvroom.nl
    availability: [BUILD, RUNTIME]
  - variable: VVOS_REQUIRE_AUTH
    value: "true"
    availability: [BUILD, RUNTIME]
  - variable: VVOS_DATA_MODE
    value: firebase
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCSTUhvLEuJsododYPMyY7Am6br1HTMNx4
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: voltvroom-staging.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: voltvroom-staging
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: voltvroom-staging.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "241472991923"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:241472991923:web:75467e4adfacf620e936c6
    availability: [BUILD, RUNTIME]

  # Google Drive / Shared Drive koppeling voor Volt & Vroom.
  # Keyless: App Hosting runtime identity requests a short-lived Drive token for itself.
  - variable: GOOGLE_DRIVE_SERVICE_ACCOUNT_EMAIL
    value: firebase-app-hosting-compute@voltvroom-staging.iam.gserviceaccount.com
    availability: [RUNTIME]
  - variable: GOOGLE_DRIVE_SHARED_DRIVE_ID
    value: 0ACwIWboayPM-Uk9PVA
    availability: [RUNTIME]
  - variable: GOOGLE_DRIVE_BUSINESS_ROOT_FOLDER_ID
    value: 1fcxDroI7gNhWN6OJcS5dgVuSXZvKcGgq
    availability: [RUNTIME]
  - variable: GOOGLE_DRIVE_VEHICLES_FOLDER_ID
    value: 1pRkSoOpUcp8VFFtz3-pDoxmBkBtb3M9R
    availability: [RUNTIME]

  # Same secret names, separate values in each Firebase project.
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability: [RUNTIME]
  - variable: VWE_WEBHOOK_SECRET
    secret: VWE_WEBHOOK_SECRET
    availability: [RUNTIME]
  - variable: PORTAL_TOKEN_SECRET
    secret: PORTAL_TOKEN_SECRET
    availability: [RUNTIME]
  - variable: AUDIT_HASH_SALT
    secret: AUDIT_HASH_SALT
    availability: [RUNTIME]
